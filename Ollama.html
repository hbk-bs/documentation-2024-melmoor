<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000000;
            overflow-x: hidden; /* Verhindert horizontales Scrollen */
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 14px 16px;
            box-sizing: border-box; /* Stellt sicher, dass Padding und Border zur Gesamtbreite beitragen */
        }
        .navbar a {
            color: rgb(0, 0, 0);
            text-align: center;
            text-decoration: none;
            margin: 0px 20px;
        }
        .navbar .center {
            flex-grow: 1;
            color: rgb(0, 0, 0);
            font-weight: 700;
            font-size: 25px;
            display: flex;
            justify-content: center;
        }
        .p {
            margin: 10px 0; /* Abstand oben und unten für das p-Element */
        }
        p {
           color: #ffffff;
        }
        h1 {
            margin-top: 70px; /* Platz für die Navbar */
            color: #23521fda;
        }
        a {
            color: #233f21da;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 900px;
            gap: 20px;
            margin-top: 100px; /* Platz für die fixierte Navbar */
            padding: 0 10px; /* Füge seitlichen Abstand hinzu, um zu verhindern, dass die Inhalte den Rand berühren */
            box-sizing: border-box; /* Stellt sicher, dass Padding zur Gesamtbreite beiträgt */
        }
        .content {
            max-width: 900px; /* Maximale Breite des Textcontainers */
            margin: 0 auto; /* Zentriert den Textcontainer */
            text-align: left; /* Optionale Einstellung, um den Text im Blocksatz anzuzeigen */
            padding-bottom: 100px; /* Fügt Platz am unteren Rand hinzu */
        }
        .content img {
            max-width: 100%; /* Bilder passen sich der Breite des Containers an */
            height: auto; /* Beibehaltung des Seitenverhältnisses */
            display: block; /* Entfernt eventuell vorhandene Abstände unterhalb der Bilder */
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px; /* Abstand zwischen dem Text und den Buttons */
        }
        .button:hover {
            background-color: #fafdd5;
            transform: scale(1.05);
        }
        .button {
            display: inline-block;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 700;
            color: rgb(0, 0, 0);
            background-color: #ffffff;
            border: none;
            border-radius: 15px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        /* Neuer Style für den fixierten Button */
        .fixed-button {
            position: fixed;
            bottom: 20px; /* Abstand vom unteren Rand des Bildschirms */
            left: 20px;   /* Abstand vom linken Rand des Bildschirms */
            z-index: 1000; /* Stelle sicher, dass der Button über anderen Inhalten liegt */
        }
        .image-row {
            display: flex;
            justify-content: space-between; /* Platz zwischen den Bildern */
            gap: 10px; /* Abstand zwischen den Bildern */
            width: 100%; /* Die Bilderreihe nimmt die volle Breite des Containers ein */
            margin: 0px 0 0px; /* Abstand oberhalb und unterhalb der Bilderreihe */
            box-sizing: border-box; /* Padding wird zur Breite der Bilderreihe hinzugefügt */
        }
        .image-row img {
            width: 3auto; /* Jedes Bild nimmt ein Drittel der Breite ein */
            max-width: 100%; /* Bilder werden nicht größer als der Container */
            height: 33%; /* Beibehaltung des Seitenverhältnisses */
            object-fit: cover; /* Bild wird skaliert und beschnitten, um in den Container zu passen */
        }
        @media(min-width: 768px) {
            .container {
                flex-direction: row;
                flex-wrap: wrap; /* Erlaubt Umbruch, wenn der Platz nicht ausreicht */
                justify-content: space-around;
            }
            .frame {
                width: calc(33.333% - 20px); /* Drei Frames nebeneinander mit Platz für Abstand */
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="index.html">★Mel</a>
    <div class="center">Good Night Poem</div>
    <a href="https://example.com" class="right">Info</a>
</div>

<div class="container">
    <div class="content">
    <img src="bilder/stars3.png" alt="Bild 2">
    </div>
    <p>
        In diesem Projekt habe ich die Teachable Machine genutzt, um ein Spiel zu entwickeln, 
        bei dem man Posen nachahmen muss. Die Idee basiert auf dem Spiel Just Dance. 
    </p>
</div>

<!-- Fixierter Button -->
<a href="index2.html" class="button fixed-button">zu den Projekten</a>

</body>
</html>
