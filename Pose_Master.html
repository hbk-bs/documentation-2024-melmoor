<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #c7c4a298;
            overflow-x: hidden; /* Verhindert horizontales Scrollen */
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #152b13da;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 14px 16px;
            box-sizing: border-box; /* Stellt sicher, dass Padding und Border zur Gesamtbreite beitragen */
        }
        .navbar a {
            color: white;
            text-align: center;
            text-decoration: none;
            margin: 0px 20px;
        }
        .navbar .center {
            flex-grow: 1;
            color: white;
            font-weight: 700;
            font-size: 25px;
            display: flex;
            justify-content: center;
        }
        .p {
            margin: 30px 0; /* Abstand oben und unten für das p-Element */
        }
        h1 {
            margin-top: 70px; /* Platz für die Navbar */
            color: #23521fda;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 90%;
            gap: 20px;
            margin-top: 100px; /* Platz für die fixierte Navbar */
            padding: 0 10px; /* Füge seitlichen Abstand hinzu, um zu verhindern, dass die Inhalte den Rand berühren */
            box-sizing: border-box; /* Stellt sicher, dass Padding zur Gesamtbreite beiträgt */
        }
        .frame {
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Verteilt den Raum zwischen den Elementen */
            position: relative; /* Für die absolute Positionierung der Buttons */
            width: 100%;
            padding: 20px;
            border: 2px dashed #23521fda;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            box-sizing: border-box; /* Stellt sicher, dass Padding zur Gesamtbreite beiträgt */
        }
        .frame img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px; /* Abstand zwischen dem Text und den Buttons */
        }
        .button:hover {
            background-color: #23521f77;
            transform: scale(1.05);
        }
        .button {
            display: inline-block;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background-color: #23521fda;
            border: none;
            border-radius: 15px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
 /* Neuer Style für den fixierten Button */
 .fixed-button {
            position: fixed;
            bottom: 20px; /* Abstand vom unteren Rand des Bildschirms */
            left: 20px;   /* Abstand vom linken Rand des Bildschirms */
            z-index: 1000; /* Stelle sicher, dass der Button über anderen Inhalten liegt */
        }
        @media(min-width: 768px) {
            .container {
                flex-direction: row;
                flex-wrap: wrap; /* Erlaubt Umbruch, wenn der Platz nicht ausreicht */
                justify-content: space-around;
            }
            .frame {
                width: calc(33.333% - 20px); /* Drei Frames nebeneinander mit Platz für Abstand */
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="index.html">★Mel</a>
    <div class="center">Pose Master</div>
    <a href="https://example.com" class="right">Info</a>
</div>

<div class="container">
    <div class="content">
        <!-- Dein Inhalt hier -->
    </div>
</div>

<!-- Fixierter Button -->
<a href="index2.html" class="button fixed-button">zu den Projekten</a>

</body>
</html>
